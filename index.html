</head><body>
<title>Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito:wght@400;600;700&display=swap">



<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sp" viewBox="0 0 24 24"><path d="M12 0C12.8 7 17 11.2 24 12C17 12.8 12.8 17 12 24C11.2 17 7 12.8 0 12C7 11.2 11.2 7 12 0Z"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11.2C4 6.7 6.2 5 8.4 5c1.5 0 2.7.8 3.6 2 .9-1.2 2.1-2 3.6-2C17.8 5 20 6.700 20 9.800 20 15.800 12 21 12 21Z"/></symbol>
</svg>

<div class="app">
  <aside class="side">
    <nav class="nav" aria-label="Main">
      <a href="#chat" id="nav-chat">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 12c0-4 3.600-7 8-7s8 3 8 7-3.600 7-8 7c-1.200 0-2.300-.2-3.300-.6L4.500 20l1.300-3.600C4.600 15.200 4 13.700 4 12Z"/><path d="M9 12h.01M12 12h.01M15 12h.01" stroke-width="2.4"/></svg>
        Chat
      </a>
      <a href="#history" id="nav-history">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.400-5.700L4 8.500"/><path d="M4 4v4.500h4.500"/><path d="M12 8v4.500l3 1.800"/></svg>
        History
      </a>
      <a href="#settings" id="nav-settings">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.200"/><path d="M19.400 13.500a1.600 1.600 0 0 0 .3 1.800l.1.100a2 2 0 1 1-2.800 2.800l-.1-.1a1.600 1.600 0 0 0-1.800-.3 1.600 1.600 0 0 0-1 1.500V19a2 2 0 1 1-4 0v-.1a1.600 1.600 0 0 0-1-1.500 1.600 1.600 0 0 0-1.800.3l-.1.100a2 2 0 1 1-2.800-2.800l.1-.1a1.600 1.600 0 0 0 .3-1.800 1.600 1.600 0 0 0-1.500-1H5a2 2 0 1 1 0-4h.1a1.600 1.600 0 0 0 1.500-1 1.600 1.600 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.100a1.600 1.600 0 0 0 1.800.3h0a1.600 1.600 0 0 0 1-1.500V5a2 2 0 1 1 4 0v.1a1.600 1.600 0 0 0 1 1.500h0a1.600 1.600 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.600 1.600 0 0 0-.3 1.800v0a1.600 1.600 0 0 0 1.500 1H19a2 2 0 1 1 0 4h-.1a1.600 1.600 0 0 0-1.500 1Z"/></svg>
        Settings
      </a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="brand-m"></div>
      <button class="ghost txt" id="newchat" type="button" aria-label="New chat">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span>
      </button>
      <button class="ghost" id="theme" type="button" aria-label="Toggle light and dark theme">
        <svg class="i" id="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.500v2.200M12 19.300v2.200M2.500 12h2.200M19.300 12h2.200M5.300 5.300l1.500 1.500M17.200 17.200l1.500 1.500M5.300 18.700l1.500-1.500M17.200 6.800l1.500-1.500"/></svg>
        <svg class="i" id="ico-moon" viewBox="0 0 24 24" hidden><path d="M20 14.500A8.500 8.500 0 0 1 9.500 4 8.500 8.500 0 1 0 20 14.500Z"/></svg>
      </button>
      <a class="ghost avatar-btn" href="#settings" aria-label="Your profile and settings">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.200"/><path d="M3.800 21c.4-4.400 3.800-6.800 8.200-6.800s7.800 2.400 8.200 6.800Z"/></svg>
      </a>
    </header>

    <div class="views">
      <section class="view" id="view-chat">
        <div class="stage" id="stage">
          <svg class="spark" style="left:6%;top:10%;width:54px;height:54px"><use href="#sp"/></svg>
          <svg class="spark" style="left:3%;top:32%;width:26px;height:26px;animation-delay:-1.4s"><use href="#sp"/></svg>
          <svg class="spark" style="right:6%;top:14%;width:74px;height:74px;animation-delay:-2.2s"><use href="#sp"/></svg>
          <svg class="spark" style="right:2%;top:40%;width:44px;height:44px;animation-delay:-.7s"><use href="#sp"/></svg>
          <svg class="spark" style="left:46%;bottom:7%;width:26px;height:26px;animation-delay:-2.9s"><use href="#sp"/></svg>
          <div class="hero-wrap">
            <div class="arch"></div>
            <button class="mascot hero" id="hero" type="button" data-mood="neutral" aria-label="Emilly. Tap to poke her."><span class="mp"><span class="mb"></span></span></button>
          </div>
          <div class="hello">
            <h1>Hello! I'm Emilly &#9825;</h1>
            <p>I'm here to help you, anytime!</p>
            <p>Just chat with me about anything~ &#10022;</p>
            <div class="sugs" id="sugs"><button type="button">Ceritakan sesuatu yang menarik</button><button type="button">Bantu aku belajar</button><button type="button">Kasih aku ide</button><button type="button">Bantu tulis kode</button></div>
          </div>
        </div>
        <div class="log" id="log" hidden aria-live="polite"></div>
        <div class="composer">
          <button class="mascot peek" id="peek" type="button" data-mood="neutral" aria-label="Emilly. Tap to poke her."><span class="mp"><span class="mb"></span></span></button>
          <div class="chip" id="chip"><img id="chip-img" alt=""><span>Image attached</span><button type="button" id="chip-x" aria-label="Remove image">&times;</button></div>
          <form class="pill" id="form" autocomplete="off">
            <button class="clip" id="clip" type="button" aria-label="Attach an image" hidden>
              <svg class="i" viewBox="0 0 24 24"><path d="M20.500 11.500l-8 8a5.200 5.200 0 0 1-7.400-7.400l8.500-8.500a3.500 3.500 0 0 1 5 5l-8.500 8.500a1.800 1.800 0 0 1-2.500-2.500l7.800-7.800"/></svg>
            </button>
            <input type="file" id="file" accept="image/*" hidden>
            <textarea id="msg" rows="1" placeholder="Type a message..." aria-label="Message"></textarea>
            <button class="send" id="send" type="submit" aria-label="Send">
              <svg class="i" viewBox="0 0 24 24"><path d="M21 3L10.500 13.500"/><path d="M21 3l-6.500 18-4-7.500L3 9.500 21 3Z"/></svg>
              <span class="stop"></span>
            </button>
          </form>
        </div>
      </section>

      <section class="view" id="view-history" hidden>
        <div class="page">
          <h2>History</h2>
          <div class="list" id="hist-list"></div>
        </div>
      </section>

      <section class="view" id="view-settings" hidden>
        <div class="page">
          <h2>Settings</h2>
          <div class="form">
            <div class="field">
              <label for="set-name">Your nickname<small>What Emilly calls you.</small></label>
              <input type="text" id="set-name" maxlength="30" placeholder="e.g. Kak Doan">
            </div>
            <div class="field">
              <span class="lbl">Chat history<small>Saved only in this browser.</small></span>
              <span id="clear-box"><button class="btn danger" type="button" id="clear">Clear all history</button></span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
